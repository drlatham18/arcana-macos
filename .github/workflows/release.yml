name: Build and publish Mac release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test engine
        run: PYTHONPATH=Resources/engine python3 -m unittest discover -s tests
      - name: Build universal app
        run: python3 scripts/build.py
      - name: Test native placement
        run: |
          swiftc Sources/ArenaPlacement.swift tests/ArenaPlacementTests.swift -o /tmp/placement-tests
          /tmp/placement-tests
      - name: Package and verify
        run: |
          python3 scripts/package.py
          codesign --verify --deep --strict dist/Arcana.app
      - uses: actions/upload-artifact@v4
        with:
          name: Arcana-1.3
          retention-days: 3
          path: |
            dist/Arcana-1.3-*.dmg
            dist/Arcana-1.3-*.zip
            dist/SHA256SUMS.txt
      - name: Publish free release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Arcana-1.3-*.dmg dist/Arcana-1.3-*.zip dist/SHA256SUMS.txt --title 'Arcana 1.3 — Free Learning Edition' --notes-file release/NOTES-1.3.md --verify-tag
